name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  luau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Roblox toolchain
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ewtools" && cd "$HOME/.ewtools"
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -qo luau.zip -d luau
          curl -sSL -o stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip
          unzip -qo stylua.zip
          curl -sSL -o selene.zip https://github.com/Kampfkarren/selene/releases/download/0.32.0/selene-0.32.0-linux.zip
          unzip -qo selene.zip
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          unzip -qo rojo.zip
          curl -sSL -o lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip
          unzip -qo lsp.zip
          curl -sSL -o roblox-globaltypes.d.luau \
            https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.None.d.luau
          chmod +x luau/luau luau/luau-analyze stylua selene rojo luau-lsp
          ./selene generate-roblox-std
          echo "TOOLS_DIR=$HOME/.ewtools" >> "$GITHUB_ENV"

      - name: Generate sourcemap
        run: rojo sourcemap default.project.json --output sourcemap.json

      - name: Typecheck (--!strict vs Roblox API dump)
        run: |
          luau-lsp analyze --definitions="$TOOLS_DIR/roblox-globaltypes.d.luau" --sourcemap=sourcemap.json src \
            | grep -v '^\[INFO\]' | tee typecheck.log
          ! grep -qE 'TypeError|SyntaxError' typecheck.log

      - name: Lint
        run: selene --display-style quiet src tests

      - name: Format check
        run: stylua --check src tests

      - name: Unit + balance tests (real Luau interpreter)
        run: python3 tools/test_build.py && "$TOOLS_DIR/luau/luau" tests/.build/run.luau

      - name: Place builds
        run: rojo build default.project.json -o /tmp/Echowake.rbxlx && ls -la /tmp/Echowake.rbxlx
